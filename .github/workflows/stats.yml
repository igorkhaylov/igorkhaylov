name: Refresh profile stats

# Regenerates the README stat cards (assets/*.svg) from the public GitHub API.
# The cards used to come from the shared github-readme-stats instance, which
# regularly answers 503 and leaves broken images on the profile; serving
# committed SVGs from this repository cannot break.

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SVG cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_stats.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet && { echo "stats unchanged"; exit 0; }
          git commit -m "[IMP] refresh profile stat cards"
          git push
